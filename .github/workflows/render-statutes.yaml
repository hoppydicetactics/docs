name: Render statutes and release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - statutes.md

  workflow_dispatch:

permissions:
  contents: write

env:
  HEADER_TEXT: Statuten Hoppy Dice Tactics
  OUTPUT_FILE: Hoppy Dice Tactics Statuten

jobs:
  render-and-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract date from statutes
        id: statutes_date
        run: |
          EXTRACTED_DATE=$(tail -n 1 statutes.md | grep -oP '\d{1,2}\.\d{1,2}\.\d{4}')
          if [[ -z "$EXTRACTED_DATE" ]]; then
            echo "::error::No date found in last line of statutes.md"
            exit 1
          fi
          echo "date=$EXTRACTED_DATE" >> $GITHUB_OUTPUT

      - name: Generate timestamp from render time
        id: render_date
        run: |
          RENDER_TS=$(date +'%Y%m%d-%H%M%S')
          echo "time=$RENDER_TS" >> $GITHUB_OUTPUT

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Render markdown to PDF
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            HEADER_TEXT="${{ env.HEADER_TEXT }} - Entwurf ${{ steps.render_date.outputs.time }}"
            OUTPUT_FILE="${{ env.OUTPUT_FILE }} Entwurf ${{ steps.render_date.outputs.time }}.pdf"
          else
            HEADER_TEXT="${{ env.HEADER_TEXT }} - ${{ steps.render_date.outputs.time }}"
            OUTPUT_FILE="${{ env.OUTPUT_FILE }} ${{ steps.statutes_date.outputs.date }}.pdf"
          fi

          sed -i "s/__HEADER_TEXT__/$HEADER_TEXT/g" templates/statutes.yaml

          pandoc templates/statutes.yaml statutes.md \
            --output "$OUTPUT_FILE" \
            --pdf-engine xelatex

      - name: Create GitHub Release
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ env.OUTPUT_FILE }} vom ${{ steps.statutes_date.outputs.date }}
          files: ${{ env.OUTPUT_FILE }} ${{ steps.statutes_date.outputs.date }}.pdf
          name: Statuten ${{ steps.statutes_date.outputs.date }}
          tag_name: ${{ steps.render_date.outputs.time }}

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ env.OUTPUT_FILE }} Entwurf ${{ steps.render_date.outputs.time }}
          path: ${{ env.OUTPUT_FILE }} Entwurf ${{ steps.render_date.outputs.time }}.pdf
          retention-days: 7
